[workspace]
members = [
    "crates/sge-app",
    "crates/sge-cli",
    "crates/sge-domain",
    "crates/sge-eval",
    "crates/sge-protocol",
    "crates/sge-provider",
    "crates/sge-store",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/abinzhao/singularity-engine"
rust-version = "1.97"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
walkdir = "2.5"
